# Cloudflare Workers (static assets) config.
# Workers Builds runs: build `npm run build`, then deploy `npx wrangler deploy`.
# `name` must match the Worker name in the Cloudflare dashboard.
name = "chok-shopify-demo"
compatibility_date = "2026-11-01"

[assets]
directory = "./dist"
# Serve index.html for unknown paths so deep links like /theme/hero work on refresh.
not_found_handling = "single-page-application"
